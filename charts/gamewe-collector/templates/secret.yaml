{{- if not .Values.existingSecret }}
{{- if not .Values.config }}
{{- fail "set config (the collector's config.yaml) or existingSecret (a Secret with the key config.yaml)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gamewe-collector.fullname" . }}
  labels:
    {{- include "gamewe-collector.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- if kindIs "string" .Values.config }}
    {{- .Values.config | nindent 4 }}
    {{- else }}
    {{- toYaml .Values.config | nindent 4 }}
    {{- end }}
{{- end }}
