apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gamewe-collector.fullname" . }}
  labels:
    {{- include "gamewe-collector.labels" . | nindent 4 }}
spec:
  # One collector per database, never two at once (also not while updating).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gamewe-collector.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gamewe-collector.selector" . | nindent 8 }}
      {{- if or (not .Values.existingSecret) .Values.podAnnotations }}
      annotations:
        {{- if not .Values.existingSecret }}
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run", "-config", "/etc/gamewe/collector/config.yaml"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: logs
              containerPort: {{ .Values.service.udpPort }}
              protocol: UDP
            {{- if .Values.service.http.enabled }}
            - name: http-logs
              containerPort: {{ .Values.service.http.port }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/gamewe/collector
              readOnly: true
            - name: data
              mountPath: /var/lib/gamewe
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: {{ include "gamewe-collector.secretName" . }}
            items:
              - key: config.yaml
                path: config.yaml
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "gamewe-collector.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
