name: build

# Every push (any branch) and every pull request runs the tests (unit,
# integration against MariaDB, PostgreSQL and SQL Server), scans the image with Trivy and
# builds everything a release ships: the packages for Linux (tar.gz) and
# Windows (zip, after the Windows tests; workflow artifacts for 7 days), the
# Helm chart (helm package) and the image. A push to main also
# publishes the image as ghcr.io/dennispohlmann/gamewe-collector:edge, and so
# does the weekly run (schedule), to take in base image updates. Nothing else
# is published then: no tag, no GitHub release, no semantic-release.
#
# A release is only made by hand: Actions -> build -> Run workflow on main
# with "release" ticked, or `gh workflow run build.yml --ref main -f
# release=true`. test, integration and image-scan run first (a fixable HIGH
# or CRITICAL vulnerability stops the release); only when they passed does
# semantic-release read the Conventional Commits since the last tag: for a
# feat, fix or breaking change it bumps the version files, writes
# CHANGELOG.md, commits that as "chore(release): vX.Y.Z [skip ci]", tags
# vX.Y.Z and creates the GitHub release as a draft. package and docker then
# build the tag: both archives go into the release, the image gets the tags
# <version>, <major>.<minor> and latest, and the Helm chart
# charts/gamewe-collector (its version set by semantic-release) goes to
# oci://ghcr.io/<owner>/charts and into the release. publish makes the draft
# public once everything is in it, so a release never shows up without its
# files. docs, chore, ci etc. make no release.
on:
  push:
    # every branch except Dependabot's: its pull request builds them anyway
    branches: ['**', '!dependabot/**']
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      release:
        description: Make a release (semantic-release, tag, GitHub release, versioned image and chart)
        type: boolean
        default: false

# A newer push or pull request update cancels the older check run; manual
# runs (and so releases) and the weekly run are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      # The web's gamewe_* option keys must be known to the collector
      # (settings.WebKeys), or gamewe check reports them as typos.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DennisPohlmann/gameWE-web
          path: gamewe-web
          persist-credentials: false
      - name: web keys in step
        run: GAMEWE_WEB_SRC="$GITHUB_WORKSPACE/gamewe-web" go test -count=1 -run TestWebSourceKeys ./internal/settings
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: ./.github/actions/setup-helm
      - name: helm chart
        run: |
          helm lint charts/gamewe-collector --strict --set config=x
          helm template gamewe charts/gamewe-collector --set existingSecret=x --set hostNetwork=false --set service.http.enabled=true > /dev/null
          helm package charts/gamewe-collector --destination "$RUNNER_TEMP/chart"

  # Windows: go vet and the unit tests on a real Windows, then the service
  # once (install, start, its log, stop, uninstall) with the example config:
  # it starts, reads the config as its virtual account, logs and stops
  # again on the missing database. The zip is only built when this passed.
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      # LF as in the repository: the schema, the chart and the unit are read
      # by the tests (the zip is built on Linux anyway).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: service
        run: |
          folder() { cygpath -u "$(powershell -NoProfile -Command "[Environment]::GetFolderPath('$1')" | tr -d '\r')"; }
          # where the service account may run it, as in INSTALLATION.md
          bin="$(folder ProgramFiles)/gameWE/collector"
          mkdir -p "$bin"
          go build -o "$bin/gamewe.exe" ./cmd/gamewe
          g="$bin/gamewe.exe"
          dir="$(folder CommonApplicationData)/gameWE/collector"
          mkdir -p "$dir"
          cp config.example.yaml "$dir/config.yaml"
          "$g" service install -n
          "$g" service install -f
          "$g" service start -f
          log="$dir/data/collector.log"
          for _ in $(seq 30); do grep -q "gamewe run:" "$log" 2>/dev/null && break; sleep 1; done
          cat "$log"
          grep -q "gameWE collector starting" "$log"
          grep -q "not reachable" "$log"
          sc.exe qc gamewe-collector
          icacls "$(cygpath -w "$dir/config.yaml")"
          "$g" service stop -f || true # stopped already when it failed
          "$g" service uninstall -f

  # All three databases, created from scratch with the init scripts and
  # gamewe db migrate: gamewe for the collector tests (they delete all
  # rows), gamewe_init stays as created. The migration tests create and drop
  # their own databases mig_* (new, HLstatsX, older gameWE, lock, rights).
  # Two LTS lines of MariaDB, the two newest PostgreSQL versions and SQL
  # Server 2022 (the Developer edition of Microsoft's image; ACCEPT_EULA
  # accepts its license for these test runs).
  integration:
    needs: test
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mariadb: '11.4', postgres: '17', mssql: '2022-latest'}
          - {mariadb: '12.3', postgres: '18', mssql: '2022-latest'}
    name: integration (MariaDB ${{ matrix.mariadb }}, PostgreSQL ${{ matrix.postgres }}, SQL Server ${{ matrix.mssql }})
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.mssql }}
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Gamewe_Test1
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Gamewe_Test1 -Q 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      COLLECTOR_PASSWORD: colpw
      WEB_PASSWORD: webpw
      WEB_ADMIN_PASSWORD: admpw
      GAMEWE_TEST_DB_HOST: 127.0.0.1
      GAMEWE_TEST_DB_USER: gamewe
      GAMEWE_TEST_DB_PASSWORD: colpw
      GAMEWE_TEST_DB_NAME: gamewe
      GAMEWE_TEST_DB_WIPE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: init databases
        env: # the job context is not available in the job-level env
          MYSQL: docker exec -i ${{ job.services.mariadb.id }} mariadb -uroot -proot
          PSQL: docker exec -i ${{ job.services.postgres.id }} psql -U postgres
          SQLCMD: docker exec -i -e SQLCMDPASSWORD -e db -e collector_pw -e web_pw -e admin_pw ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd
          SQLCMDPASSWORD: Gamewe_Test1
        run: |
          for db in gamewe gamewe_init; do
            DB_NAME=$db schema/init/init-db.sh
            DB_NAME=$db schema/postgres/init/init-db.sh
            DB_NAME=$db schema/mssql/init/init-db.sh -S localhost -U sa -C
          done
      - name: create the tables (gamewe db migrate)
        run: |
          go build -o "$RUNNER_TEMP/gamewe" ./cmd/gamewe
          for db in gamewe gamewe_init; do
            for t in mariadb:3306 postgres:5432 mssql:1433; do
              cfg="$RUNNER_TEMP/$db-${t%%:*}.yaml"
              printf 'database:\n  type: %s\n  host: 127.0.0.1\n  port: %s\n  user: gamewe\n  password: %s\n  name: %s\n' \
                "${t%%:*}" "${t##*:}" "$COLLECTOR_PASSWORD" "$db" > "$cfg"
              "$RUNNER_TEMP/gamewe" db migrate -f -config "$cfg"
              "$RUNNER_TEMP/gamewe" db migrate -n -config "$cfg"
            done
          done
      - name: migrations (MariaDB)
        env:
          GAMEWE_TEST_MIGRATE_TYPE: mysql
          GAMEWE_TEST_MIGRATE_HOST: 127.0.0.1
          GAMEWE_TEST_MIGRATE_PORT: 3306
          GAMEWE_TEST_MIGRATE_ADMIN_USER: root
          GAMEWE_TEST_MIGRATE_ADMIN_PASSWORD: root
        run: go test -count=1 -p 1 -tags integration -run Migrate -v ./internal/database/ ./cmd/gamewe/
      - name: migrations (PostgreSQL)
        env:
          GAMEWE_TEST_MIGRATE_TYPE: postgres
          GAMEWE_TEST_MIGRATE_HOST: 127.0.0.1
          GAMEWE_TEST_MIGRATE_PORT: 5432
          GAMEWE_TEST_MIGRATE_ADMIN_USER: postgres
          GAMEWE_TEST_MIGRATE_ADMIN_PASSWORD: postgres
        run: go test -count=1 -p 1 -tags integration -run Migrate -v ./internal/database/ ./cmd/gamewe/
      - name: migrations (SQL Server)
        env:
          GAMEWE_TEST_MIGRATE_TYPE: mssql
          GAMEWE_TEST_MIGRATE_HOST: 127.0.0.1
          GAMEWE_TEST_MIGRATE_PORT: 1433
          GAMEWE_TEST_MIGRATE_ADMIN_USER: sa
          GAMEWE_TEST_MIGRATE_ADMIN_PASSWORD: Gamewe_Test1
        run: go test -count=1 -p 1 -tags integration -run Migrate -v ./internal/database/ ./cmd/gamewe/
      - name: init scripts, grants, schema parity
        env:
          GAMEWE_TEST_INIT_MYSQL: 127.0.0.1:3306/gamewe_init
          GAMEWE_TEST_INIT_PG: 127.0.0.1:5432/gamewe_init
          GAMEWE_TEST_INIT_MSSQL: 127.0.0.1:1433/gamewe_init
          GAMEWE_TEST_WEB_PASSWORD: webpw
          GAMEWE_TEST_WEB_ADMIN_PASSWORD: admpw
        run: go test -count=1 -tags integration -run Init -v ./internal/database/
      - name: collector (MariaDB)
        env:
          GAMEWE_TEST_DB_TYPE: mysql
          GAMEWE_TEST_DB_PORT: 3306
        run: go test -count=1 -race -p 1 -tags integration ./internal/collector/ ./internal/admin/
      - name: collector (PostgreSQL)
        env:
          GAMEWE_TEST_DB_TYPE: postgres
          GAMEWE_TEST_DB_PORT: 5432
        run: go test -count=1 -race -p 1 -tags integration ./internal/collector/ ./internal/admin/
      - name: collector (SQL Server)
        env:
          GAMEWE_TEST_DB_TYPE: mssql
          GAMEWE_TEST_DB_PORT: 1433
        run: go test -count=1 -race -p 1 -tags integration ./internal/collector/ ./internal/admin/
      # database.table_prefix: the gw_ tables beside the hlstats_ ones of the
      # same databases; the rows of the hlstats_ tables must stay as they are.
      - name: table prefix gw (MariaDB, PostgreSQL and SQL Server)
        env:
          GAMEWE_TEST_DB_PREFIX: gw
          GAMEWE_TEST_INIT_MYSQL: 127.0.0.1:3306/gamewe_init
          GAMEWE_TEST_INIT_PG: 127.0.0.1:5432/gamewe_init
          GAMEWE_TEST_INIT_MSSQL: 127.0.0.1:1433/gamewe_init
          GAMEWE_TEST_WEB_PASSWORD: webpw
          GAMEWE_TEST_WEB_ADMIN_PASSWORD: admpw
          GAMEWE_TEST_MIGRATE_HOST: 127.0.0.1
        run: |
          rows() { for t in mariadb postgres mssql; do "$RUNNER_TEMP/gamewe" db reset -n -o json -config "$RUNNER_TEMP/gamewe-$t.yaml"; done; }
          before=$(rows)
          for db in gamewe gamewe_init; do
            for t in mariadb postgres mssql; do
              sed 's/^database:$/database:\n  table_prefix: gw/' "$RUNNER_TEMP/$db-$t.yaml" > "$RUNNER_TEMP/gw-$db-$t.yaml"
              "$RUNNER_TEMP/gamewe" db migrate -f -config "$RUNNER_TEMP/gw-$db-$t.yaml"
              "$RUNNER_TEMP/gamewe" db migrate -n -config "$RUNNER_TEMP/gw-$db-$t.yaml"
            done
          done
          go test -count=1 -tags integration -run Init ./internal/database/
          for t in mysql:3306:root:root postgres:5432:postgres:postgres mssql:1433:sa:Gamewe_Test1; do
            IFS=: read -r typ port admin pw <<< "$t"
            GAMEWE_TEST_DB_TYPE=$typ GAMEWE_TEST_DB_PORT=$port go test -count=1 -p 1 -tags integration ./internal/collector/ ./internal/admin/
            GAMEWE_TEST_MIGRATE_TYPE=$typ GAMEWE_TEST_MIGRATE_PORT=$port GAMEWE_TEST_MIGRATE_ADMIN_USER=$admin GAMEWE_TEST_MIGRATE_ADMIN_PASSWORD=$pw \
              go test -count=1 -p 1 -tags integration -run Migrate ./internal/database/ ./cmd/gamewe/
          done
          [ "$before" = "$(rows)" ] || { echo "the rows of the hlstats_ tables changed"; exit 1; }

  # Builds the image without pushing it and scans it: HIGH or CRITICAL
  # vulnerabilities that have a fix fail, and so do HIGH or CRITICAL
  # misconfigurations of the Dockerfile. Findings accepted on purpose go into
  # .trivyignore with a reason and an expiry date.
  image-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-trivy
      - name: scan the Dockerfile
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 .
      - name: GeoIP database (DB-IP City Lite, CC BY 4.0)
        run: make geoip
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: gamewe-collector:scan
      - name: scan the image
        run: >-
          trivy image --scanners vuln --ignore-unfixed
          --severity HIGH,CRITICAL --exit-code 1 gamewe-collector:scan

  release:
    needs: [test, windows, integration, image-scan]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: releases only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::a release can only be made from main, not from $GITHUB_REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # all tags and commits since the last release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        # semantic-release and its plugins as pinned in tools/release/package-lock.json
        run: |
          npm ci --prefix tools/release --ignore-scripts --no-audit --no-fund
          tools/release/node_modules/.bin/semantic-release
      # semantic-release exits 0 also when it made no release: no feat/fix
      # since the last tag, or main moved on while the checks ran. A run with
      # release ticked must not end green then.
      - name: stop if nothing was released
        if: steps.release.outputs.version == ''
        run: |
          echo "::error::semantic-release made no release, see the step above"
          exit 1

  # Runs after the release job (or without it when there is no release) and
  # builds the new tag if there was a release, otherwise the pushed commit.
  package:
    needs: [test, windows, integration, image-scan, release]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.windows.result == 'success' && needs.integration.result == 'success' && needs.image-scan.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.version != '' && format('v{0}', needs.release.outputs.version) || github.sha }}
          fetch-depth: 0 # tags, for the version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: make package package-windows
        run: make package package-windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gamewe-collector-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gamewe-collector-windows-amd64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 7
      - name: add the archives to the release
        if: env.RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$RELEASE" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.zip dist/*.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"

  # A release also publishes the Helm chart (charts/gamewe-collector, its
  # version set to the release by semantic-release): as an OCI artifact
  # oci://ghcr.io/<owner>/charts/gamewe-collector and as a file in the
  # release.
  chart:
    needs: [release, package]
    if: needs.release.outputs.version != '' && needs.package.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: ./.github/actions/setup-helm
      - name: package and publish the chart
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -qx "version: $RELEASE" charts/gamewe-collector/Chart.yaml
          mkdir -p dist
          helm package charts/gamewe-collector --destination dist
          echo "$REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/gamewe-collector-$RELEASE.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          gh release upload "v$RELEASE" "dist/gamewe-collector-$RELEASE.tgz" --clobber --repo "$GITHUB_REPOSITORY"

  # Publishes edge on a push to main and on the weekly schedule, and on a
  # release the version tags (after the package is in the draft release),
  # with an SBOM and full provenance as attestations; a release also gets
  # the SBOM as an SPDX file. Pushes to other branches and manual runs
  # without release build the image without pushing it; a pull request
  # stops at image-scan.
  docker:
    needs: [test, integration, image-scan, release, package]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.test.result == 'success' && needs.integration.result == 'success' && needs.image-scan.result == 'success' && needs.release.result != 'failure' && needs.package.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write # the SBOM file in the release
      packages: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
      PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || needs.release.outputs.version != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.version != '' && format('v{0}', needs.release.outputs.version) || github.sha }}
          fetch-depth: 0 # tags, for the version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: GeoIP database (DB-IP City Lite, CC BY 4.0)
        run: make geoip
      - name: version
        id: version
        run: |
          v=$(make -s version)
          if [ -z "$RELEASE" ]; then v="$v-edge+${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/dennispohlmann/gamewe-collector
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=v${{ env.RELEASE }},enable=${{ env.RELEASE != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.RELEASE }},enable=${{ env.RELEASE != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE != '' }}
          flavor: latest=false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: ./.github/actions/setup-trivy
        if: env.RELEASE != ''
      - name: add the SBOM to the release
        if: env.RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          sbom="dist/gamewe-collector-$RELEASE-image.spdx.json"
          mkdir -p dist
          trivy image --format spdx-json --output "$sbom" "ghcr.io/dennispohlmann/gamewe-collector:$RELEASE"
          gh release upload "v$RELEASE" "$sbom" --clobber --repo "$GITHUB_REPOSITORY"

  # The release stays a draft until the archive, the chart and the image SBOM
  # are in it; then it is published. A failed job leaves the draft: re-run
  # the failed jobs of this run (the uploads replace what is already there).
  publish:
    needs: [release, package, chart, docker]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - name: publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$RELEASE" --draft=false --latest --repo "$GITHUB_REPOSITORY"
