# .github/dependabot.yml - gameWE collector
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      include: scope
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # Base images in the Dockerfile (golang, busybox, distroless), pinned by
  # digest: a new digest behind the same tag is a patch (Go, Debian), so they
  # are checked daily. No cooldown: it is measured from the last push of the
  # tag, and golang/busybox push their tags almost daily, so Dependabot
  # skipped every new digest ("Skipping tag ... due to cooldown period").
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: fix
      include: scope
    groups:
      docker:
        patterns: ["*"]
