name: setup helm
description: >-
  Installs a pinned Helm release for the chart in charts/ (no third-party
  action): built with go install from its module, which the Go checksum
  database verifies.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: stable
        cache: false
    - name: install helm
      shell: bash
      env:
        # A new version: the tag of the Helm release (helm/helm on GitHub).
        HELM_VERSION: v3.19.0
      run: |
        GOBIN="$RUNNER_TEMP/helm" go install "helm.sh/helm/v3/cmd/helm@${HELM_VERSION}"
        echo "$RUNNER_TEMP/helm" >> "$GITHUB_PATH"
