# gameWE - collector with Docker Compose.
#   cp docker-compose.example.yml docker-compose.yml
#   mkdir -p config && cp config.example.yaml config/config.yaml   # edit it
#   docker compose up -d && docker compose logs -f
#
# network_mode: host keeps the real source IP:port of the game servers' log
# packets. The collector identifies servers by that address
# (hlstats_Servers), so do not rely on published ports (-p) unless you have
# checked that the source address is kept (see README, Docker).
#
# Optional: a database in the same Compose project, MariaDB, PostgreSQL or
# Microsoft SQL Server (choose one with --profile; set the root password in
# .env as DB_ROOT_PASSWORD). It listens on 127.0.0.1 only, which the collector reaches
# through the host network (database.host: 127.0.0.1). Create the gameWE
# database once it is up, with the init script from the repository or the
# package (/opt/gamewe/collector/doc/schema/...):
#
#   MariaDB:     docker compose --profile mariadb up -d
#                cd schema/init && MYSQL_PWD="$DB_ROOT_PASSWORD" MYSQL='docker compose exec -T -e MYSQL_PWD mariadb mariadb' \
#                  COLLECTOR_PASSWORD=... WEB_PASSWORD=... WEB_ADMIN_PASSWORD=... ./init-db.sh -uroot
#                config: type: mariadb, port: 3306
#
#   PostgreSQL:  docker compose --profile postgres up -d
#                cd schema/postgres/init && PSQL='docker compose exec -T postgres psql' \
#                  COLLECTOR_PASSWORD=... WEB_PASSWORD=... WEB_ADMIN_PASSWORD=... ./init-db.sh -U postgres
#                config: type: postgres, port: 5432
#
#   SQL Server:  set MSSQL_ACCEPT_EULA=Y in .env if you accept Microsoft's license
#                (https://go.microsoft.com/fwlink/?linkid=857698); DB_ROOT_PASSWORD
#                needs 8+ characters of three kinds (upper, lower, digit, symbol)
#                docker compose --profile mssql up -d
#                cd schema/mssql/init && SQLCMDPASSWORD="$DB_ROOT_PASSWORD" \
#                  SQLCMD='docker compose exec -T -e SQLCMDPASSWORD -e db -e collector_pw -e web_pw -e admin_pw mssql /opt/mssql-tools18/bin/sqlcmd' \
#                  COLLECTOR_PASSWORD=... WEB_PASSWORD=... WEB_ADMIN_PASSWORD=... ./init-db.sh -S localhost -U sa -C
#                config: type: mssql, port: 1433
#
# (Run the init commands from the directory of docker-compose.yml, or add
# -f /path/to/docker-compose.yml to "docker compose".) The collector creates
# the tables at its first start and migrates the database after pulling a new
# image (database.auto_migrate, the default; make a backup before updating).
# With auto_migrate: false run this first (also by hand any time):
#   docker compose run --rm collector db migrate -f
# TLS is not needed for a database on 127.0.0.1: tls.mode: disable (the default).
services:
  collector:
    image: ghcr.io/dennispohlmann/gamewe-collector:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/config.yaml:/etc/gamewe/collector/config.yaml:ro
      # - ./config/db-ca.pem:/etc/gamewe/collector/db-ca.pem:ro   # for tls verify-ca / verify-full
      - gamewe-data:/var/lib/gamewe   # GeoIP database and its monthly update (README, GeoIP)
    logging:
      driver: json-file
      options:
        max-size: "50m"   # every received log line is logged
        max-file: "5"

  mariadb:
    profiles: [mariadb]
    image: mariadb:12.3   # LTS; 11.4 works as well
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}   # required: set it in .env
      MARIADB_AUTO_UPGRADE: "1"                      # an existing 11.x volume is upgraded at start
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mariadb:/var/lib/mysql

  postgres:
    profiles: [postgres]
    # PostgreSQL 18 keeps its data in /var/lib/postgresql/18/docker, so the
    # volume is mounted at /var/lib/postgresql. A volume of postgres:17
    # (mounted at /var/lib/postgresql/data) needs pg_upgrade or a dump and
    # restore; until then keep image postgres:17 and the old mount (README, Docker).
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-}   # required: set it in .env
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres:/var/lib/postgresql

  mssql:
    profiles: [mssql]
    image: mcr.microsoft.com/mssql/server:2022-latest   # SQL Server 2022 or newer (GREATEST, IS DISTINCT FROM)
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${MSSQL_ACCEPT_EULA:-}            # Y: you accept Microsoft's license (see above)
      MSSQL_SA_PASSWORD: ${DB_ROOT_PASSWORD:-}       # required: set it in .env
      MSSQL_PID: Express                             # free edition (10 GB per database); Developer is not for production
    ports: ["127.0.0.1:1433:1433"]
    volumes:
      - mssql:/var/opt/mssql

volumes:
  gamewe-data:
  mariadb:
  postgres:
  mssql:
