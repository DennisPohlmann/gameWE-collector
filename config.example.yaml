# gameWE - collector configuration: the UDP address for game-server logs
# and the database connection.
#
# Installed as /etc/gamewe/collector/config.yaml. It contains a password,
# so keep it readable for root and the gamewe group only:
#   chown root:gamewe config.yaml && chmod 640 config.yaml
# Validate with:  gamewe config test   (this file only, nothing started)
#                 gamewe check         (also the database connection)
#
# Everything else is read from the database and can be changed in the web
# admin without restarting the collector (reloaded every 60 seconds):
#   game servers         hlstats_Servers (address, port, game, rcon_password)
#   points and settings  hlstats_Options (gamewe_* keys), hlstats_Actions,
#                        hlstats_Weapons
# See /opt/gamewe/collector/doc/CONFIG.md.

# Where the game servers send their logs (logaddress_add <ip>:<port>).
# Both keys are optional.
listen:
  # UDP: the logs of GoldSrc and Source servers (logaddress_add). The older
  # form with address, port and public_address directly under listen is
  # still read.
  udp:
    enabled: true
    address: 0.0.0.0      # IP to listen on (0.0.0.0 = all IPv4, :: = all)
    port: 41337           # UDP port
    # The address the game servers send their logs to (registered with
    # logaddress_add, see features.log_address). Default: the collector's
    # address of the RCON connection to the server, with port. Set it when
    # the game servers reach the collector at another address (NAT).
    # public_address: 203.0.113.4:41337
  # HTTP: the logs of Counter-Strike 2 (Source 2), which sends them only
  # over HTTP: logaddress_add_http "http://<collector>:41338/<token>/<game port>"
  # (<token>: listen.http.token below, the same for all CS2 servers; the
  # game port as in the web admin).
  # Plain HTTP (CS2 offers no HTTPS); open the TCP port only for the game
  # servers. Only servers of hlstats_Servers with a Source 2 game are
  # accepted.
  http:
    enabled: false
    address: 0.0.0.0      # IP to listen on
    port: 41338           # TCP port
    # The URL the CS2 servers post to (registered with logaddress_add_http,
    # see features.log_address), http://host:port without a path. Default:
    # http:// and the collector's address of the RCON connection, with port.
    # public_url: http://203.0.113.4:41338
    # A secret first path segment (16 to 128 letters, digits, - or _): only
    # posts to /<token>/<game port> are accepted. Recommended, since CS2's
    # HTTP logs carry no sv_logsecret.
    # token: ""
    max_body: 128KiB      # largest post (4KiB to 16MiB)
    read_timeout: 10s     # time to read one post (1s to 2m)
    max_connections: 64   # open connections at most
    max_connections_per_ip: 8
    # Reverse proxies in front of the collector (IPs or CIDR): only for
    # them the sender is taken from X-Forwarded-For.
    # trusted_proxies: [127.0.0.1]

database:
  type: mariadb           # mariadb (= mysql) or postgres
  host: db.example.org
  # port: 3306            # default: 3306 (mariadb / mysql), 5432 (postgres)
  user: gamewe
  password: "change-me"
  # password_file: /etc/gamewe/collector/db-password   # alternative to password
  name: gamewe
  # table_prefix: hlstats  # tables <prefix>_Players (DB_PREFIX of HLstatsX:CE); the web needs the same
  max_open_conns: 8
  connect_timeout: 10     # seconds
  tls:
    # disable     plaintext (only for a database on localhost)
    # require     encrypted, server certificate not checked
    # verify-ca   encrypted, certificate must be signed by ca_file (or a system CA)
    # verify-full verify-ca + certificate must match host (or server_name)
    # With any mode other than disable there is never a plaintext fallback.
    mode: disable           # default; use verify-full for a database on another host
    # ca_file: /etc/gamewe/collector/db-ca.pem
    # cert_file: /etc/gamewe/collector/client.pem   # client certificate (optional)
    # key_file: /etc/gamewe/collector/client.key
    # server_name: db.internal                      # name expected in the certificate
  # At start, bring an outdated database schema up to date (as
  # "gamewe db migrate -f"; make a backup before installing a new version).
  # false: the collector refuses to start until "gamewe db migrate" ran.
  auto_migrate: true

# Player and server locations: the DB-IP City Lite database (CC BY 4.0) is
# shipped at path; auto_update replaces it there monthly. For MaxMind
# GeoLite2 set path to its file and auto_update: false.
geoip:
  path: /var/lib/gamewe/collector/dbip-city-lite.mmdb
  auto_update: true

# Optional jobs of the collector, all on by default.
features:
  rcon_status:         # RCON "status" of every server: players and bots, map, max players (DB-SEMANTICS.md)
    enabled: true
    interval: 10s      # how often (at least 2s)
  log_address:         # logaddress_list; logaddress_add + "log on" if the collector is missing
    enabled: true
    interval: 1m       # how often (at least 10s)
    http: true         # CS2 servers: logaddress_list_http / logaddress_add_http (when listen.http is on)
  log_secret:          # sv_logsecret: a server with hlstats_Servers.log_secret set must send it
    enabled: true      # (set it with gamewe server set -logsecret or in the web admin, and the
                       # same sv_logsecret in server.cfg); a server without one is not checked.
                       # false: never checked
  server_info:         # version, OS and VAC state of every server: A2S_INFO query on the game
    enabled: true      # port (no rcon_password needed), and the version line of RCON status
    interval: 5m       # how often (at least 30s)
  daily_awards:        # the daily awards of the previous day (by hand: gamewe awards -date ...)
    enabled: true
    timezone: ""       # IANA time zone of the day and the time, e.g. Europe/Berlin
                       # (empty: timezone below, else the server's)
    time: "00:00"      # HH:MM in that time zone
  inactive_players:    # once a day: players without play for MinActivity days (hlstats_Options,
    enabled: true      # web admin, default 28) who are not online move to hlstats_PlayersInactive;
                       # they come back unchanged with their next log line
    time: "01:00"      # HH:MM in timezone
    timezone: ""       # IANA time zone; empty: timezone below, else the server's
  sourcebans:          # players kicked by SourceBans are looked up on the ban list (address: web admin,
    enabled: true      # Settings -> Bans); a running ban takes them out of the ranking until it ends
    interval: 30m      # how often running bans are checked again (at least 5m)
    phrases: []        # further kick texts that mean a ban, e.g. ["gebannt"]
    allow_private: false # true: the ban list may be on the LAN or localhost
  bans_sync:           # all bans of all known players for the website (hlstats_Bans): VAC and game
    enabled: true      # bans from the Steam Web API (key: web admin, Settings -> Steam) and, with
                       # sourcebans above, the whole SourceBans list every sourcebans.interval
    steam_recheck: 24h # how long a player's Steam answer is used before asking again (at least 1h)
    steam_pause: 1s    # pause between two Steam requests of 100 players (at least 1s)
  scheduled_resets:    # rankings reset on a schedule (set in the web admin or with gamewe halloffame)
    time: "00:00"      # HH:MM in timezone below: when a period ends and the next one starts
  cs2_hitgroups:       # Counter-Strike 2: hits per body part (head, neck, chest, ...) and damage
    enabled: true      # from the attacked lines (CS2 has no plugin that reports them)
  update_check:        # ask GitHub for the latest release: run logs a newer one at start and
    enabled: true      # daily, the other commands print a note on stderr first; never installs

# The collector's time zone (IANA name, e.g. Europe/Berlin) for the daily
# jobs above without a timezone of their own. Empty: the server's time zone
# (TZ, /etc/localtime; the container image is UTC unless TZ is set).
timezone: ""
